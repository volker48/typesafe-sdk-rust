name: Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust 1.96 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
      NO_PROXY: '*'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install declared minimum Rust version
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +1.96.0 fmt --check
      - name: Type check
        run: cargo +1.96.0 check --locked --all-targets
      - name: Check without default features
        run: cargo +1.96.0 check --locked --no-default-features
      - name: Test (including local TLS)
        run: cargo +1.96.0 test --locked --all-targets --all-features
      - name: Documentation tests
        run: cargo +1.96.0 test --locked --doc
      - name: Lint
        run: cargo +1.96.0 clippy --locked --all-targets --all-features -- -D warnings
      - name: Documentation
        run: cargo +1.96.0 doc --locked --no-deps --all-features
